<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lautaro Schmitt - Portafolio</title>
  <link rel="stylesheet" href="Style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Cursor personalizado -->
  <div class="cursor"></div>

  <!-- Contenedor central -->
  <div class="contenedor-central">
    <h1 class="nombre">Lautaro Schmitt</h1>
    <p class="subtitulo">Desarrollador de aplicaciones y videojuegos</p>
  </div>

  <!-- Galería tipo lienzo -->
  <main class="mapa-imagenes">
    <a href="Work.html" class="item" style="top: 12%; left: 10%;">
      <span class="texto-rotado" style="transform: rotate(-10deg);">Work</span>
      <img src="Wireframe/mate1.svg" alt="Imagen 1" class="imagen">
    </a>
    <a href="Study.html" class="item" style="top: 8%; left: 78%;">
      <span class="texto-rotado" style="transform: rotate(12deg);">Study</span>
      <img src="Wireframe/book.svg" alt="Imagen 2" class="imagen">
    </a>
    <a href="Proyects.html" class="item" style="top: 58%; left: 12%;">
      <span class="texto-rotado" style="transform: rotate(-8deg);">Projects</span>
      <img src="Wireframe/palomitas.svg" alt="Imagen 3" class="imagen">
    </a>
    <a href="About.html" class="item" style="top: 55%; left: 85%;">
      <span class="texto-rotado" style="transform: rotate(10deg);">About</span>
      <img src="Wireframe/obeliskç.svg" alt="Imagen 4" class="imagen">
    </a>
  </main>

  <!-- Footer -->
  <footer class="footer-redes">
    <h2 class="footer-titulo">Mis redes</h2>
    <div class="redes-contenedor">
      <a href="https://github.com/tuusuario" target="_blank" class="red-social" title="GitHub">
        <img src="Wireframe/Github.svg" alt="GitHub">
      </a>
      <a href="https://linkedin.com/in/tuusuario" target="_blank" class="red-social" title="LinkedIn">
        <img src="Wireframe/linkedin.svg" alt="LinkedIn">
      </a>
      <a href="https://www.instagram.com/lautaroschm/" target="_blank" class="red-social" title="Instagram">
        <img src="Wireframe/Instagram.svg" alt="Instagram">
      </a>
    </div>
  </footer>

  <!-- Contenedor de partículas mágicas -->
  <div class="particles"></div>

  <script src="main.js"></script>
</body>
</html>
